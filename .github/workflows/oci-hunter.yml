name: OCI Hunter - AMD Micro

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: oci-hunter
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

env:
  SUPPRESS_LABEL_WARNING: "True"

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI CLI
        run: |
          pip install --quiet oci-cli

      - name: Configure OCI Credentials
        env:
          OCI_CONFIG: |
            [DEFAULT]
            user=${{ secrets.OCI_USER_OCID }}
            fingerprint=${{ secrets.OCI_FINGERPRINT }}
            key_file=/home/runner/.oci/oci_api_key.pem
            tenancy=${{ secrets.OCI_TENANCY_OCID }}
            region=${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_KEY_FILE }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          mkdir -p /home/runner/.oci
          echo "$OCI_CONFIG" > /home/runner/.oci/config
          echo "$OCI_KEY" > /home/runner/.oci/oci_api_key.pem
          chmod 600 /home/runner/.oci/config /home/runner/.oci/oci_api_key.pem

          # Verificación rápida del formato PEM en logs
          head -n 1 /home/runner/.oci/oci_api_key.pem
          tail -n 1 /home/runner/.oci/oci_api_key.pem

      - name: Execute OCI Hunter Script
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/hunt.sh
          .github/scripts/hunt.sh
