name: OCI Hunter - AMD Micro

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: oci-hunter
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

env:
  SUPPRESS_LABEL_WARNING: "True"

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI CLI
        run: |
          pip install --quiet "oci-cli==3.53.0"

      - name: Configure OCI Credentials
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_FP: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANT: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REG: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_KEY_FILE }}
        run: |
          mkdir -p /home/runner/.oci

          # Escribir config
          cat << EOF > /home/runner/.oci/config
          [DEFAULT]
          user=${OCI_USER}
          fingerprint=${OCI_FP}
          key_file=/home/runner/.oci/oci_api_key.pem
          tenancy=${OCI_TENANT}
          region=${OCI_REG}
          EOF

          # Escribir la clave privada preservando estrictamente el formato exacto
          printf "%s\n" "$OCI_PRIVATE_KEY" > /home/runner/.oci/oci_api_key.pem

          chmod 600 /home/runner/.oci/config /home/runner/.oci/oci_api_key.pem

          echo "=== Verificación de fingerprint en el runner ==="
          openssl rsa -in /home/runner/.oci/oci_api_key.pem -pubout -outform DER 2>/dev/null | openssl md5 -c

      - name: Execute OCI Hunter Script
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/hunt.sh
          .github/scripts/hunt.sh
