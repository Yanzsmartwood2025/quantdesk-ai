server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","mode":"historical-only"}';
    }
    location = /beat-data/catalog.json {
        limit_except GET { deny all; }
        default_type application/json;
        try_files $uri =404;
    }
    location ~ ^/beat-data/series/[A-Z0-9._-]{1,32}\.json$ {
        limit_except GET { deny all; }
        default_type application/json;
        try_files $uri =404;
    }
    location / { return 404; }
}
